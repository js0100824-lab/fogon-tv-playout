<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmisión en vivo</title>
<style>
:root{--accent:#0E6B73}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#fileA,#fileB,#yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#yt{pointer-events:none;inset:-9% -9%;width:118%;height:118%}
#ytmask{position:absolute;left:0;right:0;top:0;height:13%;background:#000;z-index:4}
#logo{position:absolute;top:3%;right:3%;width:14%;height:auto;opacity:.9;z-index:5;pointer-events:none}
#ticker{position:absolute;left:0;right:0;bottom:0;padding:.6rem 1rem;background:var(--accent);font-weight:600;z-index:5}
#name{position:absolute;top:3%;left:3%;padding:.25rem .7rem;background:var(--accent);font-weight:700;border-radius:4px;z-index:5}
#sound{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);border:0;color:#fff;font-size:1.4rem;cursor:pointer;z-index:9}
#sound span{padding:1rem 1.5rem;background:var(--accent);border-radius:8px}
#lower{position:absolute;left:3%;bottom:12%;max-width:70%;padding:.7rem 1.1rem;background:rgba(0,0,0,.72);border-left:6px solid var(--accent);border-radius:4px;opacity:0;transform:translateY(12px);transition:.5s;z-index:5}
#lower.show{opacity:1;transform:none}
#lower small{display:block;color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:.75rem}
#lower b{font-size:clamp(1rem,2.4vw,1.8rem)}
#prog{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent);transition:width 1s linear;z-index:6}
#fs{position:absolute;right:1rem;bottom:1rem;border:0;border-radius:6px;padding:.5rem .8rem;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;opacity:0;transition:.3s;z-index:7}
body:hover #fs{opacity:1}
body.embed #fs,body.embed #sound{display:none !important}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;font-size:1.2rem;z-index:8;pointer-events:none}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="stage">
  <video id="fileA" playsinline muted class="hidden"></video>
  <video id="fileB" playsinline muted class="hidden"></video>
  <div id="yt" class="hidden"></div>
  <div id="ytmask" class="hidden"></div>
  <div id="name" class="hidden"></div>
  <img id="logo" class="hidden" alt="">
  <div id="ticker" class="hidden"></div>
  <div id="lower"><small></small><b></b></div>
  <div id="prog"></div>
  <button id="fs" type="button">⛶ Pantalla completa</button>
  <div id="msg">Conectando…</div>
  <button id="sound" class="hidden" type="button"><span>▶ Toca para ver con sonido</span></button>
</div>
<script type="module" src="../js/player.js?v=12"></script>
</body>
</html>
