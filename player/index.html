<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fogón TV</title>
<style>
:root{--accent:#0E6B73}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background:#000}
#file,#yt{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#yt{pointer-events:none}
#logo{position:absolute;top:3%;right:3%;max-height:10%;max-width:18%;opacity:.9}
#ticker{position:absolute;left:0;right:0;bottom:0;padding:.6rem 1rem;background:var(--accent);font-weight:600}
#name{position:absolute;top:3%;left:3%;padding:.25rem .7rem;background:var(--accent);font-weight:700;border-radius:4px}
#sound{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);border:0;color:#fff;font-size:1.4rem;cursor:pointer}
#sound span{padding:1rem 1.5rem;background:var(--accent);border-radius:8px}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:1rem;font-size:1.2rem}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="stage">
  <video id="file" playsinline muted class="hidden"></video>
  <div id="yt" class="hidden"></div>
  <div id="name" class="hidden"></div>
  <img id="logo" class="hidden" alt="">
  <div id="ticker" class="hidden"></div>
  <div id="msg">Conectando…</div>
  <button id="sound" class="hidden" type="button"><span>▶ Toca para ver con sonido</span></button>
</div>
<script type="module" src="../js/player.js"></script>
</body>
</html>
